# A pool of ~30 prompts. Each enrolment picks 10 DIFFERENT prompts at random,
# so the voice sample never repeats the same set twice.
prompts:
  - text: "What's on my calendar today?"
  - text: "Remind me to call the dentist at three o'clock."
  - text: "Set a timer for ten minutes."
  - text: "What's the weather like this afternoon?"
  - text: "Play some music I can focus with."
  - text: "Add milk and eggs to my shopping list."
  - text: "Tell me a quick summary of the news."
  - text: "How long does it take to drive to the airport right now?"
  - text: "Read me the last message from my sister, and reply that I'll call her back this evening."
    tone: quieter
  - text: "Could you remind me that the design review moved to Thursday, and also order more coffee beans when you get a chance?"
    tone: louder
  - text: "Turn on the living room lights."
  - text: "Send a message to my team that I'm running a little late."
  - text: "What's the score of last night's game?"
  - text: "Add a meeting with Sam tomorrow at ten in the morning."
  - text: "Play my workout playlist."
  - text: "What's the traffic like on the way home?"
  - text: "Set an alarm for seven in the morning."
  - text: "Find the nearest coffee shop that's still open."
  - text: "Take a note that I need to book a hotel for next week."
  - text: "What time is sunset today?"
  - text: "Remind me to water the plants every Sunday."
  - text: "Open the camera app."
  - text: "Tell me a joke."
  - text: "How many steps did I walk today?"
  - text: "Order a large pepperoni pizza."
  - text: "What's the exchange rate for dollars to euros?"
  - text: "Call my mother this afternoon."
  - text: "Text Alex that I'll be there in ten minutes."
  - text: "Start a five minute meditation."
  - text: "What does my day look like tomorrow?"
